name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # weekly: catch newly published vulnerabilities

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test
      - run: npm run audit

  container:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts # the CLI generates throw-away secrets for the test
      - name: Container end-to-end test (compose, restart, recreation)
        run: bash scripts/container-test.sh
      - name: Dependency and image vulnerability scan
        run: bash scripts/security-scan.sh

  # Same end-to-end test on a Docker daemon with user-namespace remapping, as used on hardened
  # hosts: container uids map to a subordinate range, so secrets must not rely on host ownership.
  container-userns:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --omit=dev --ignore-scripts
      - name: Enable Docker user-namespace remapping
        run: |
          f=/etc/docker/daemon.json
          if [ -s "$f" ]; then sudo jq '. + {"userns-remap": "default"}' "$f" > /tmp/daemon.json
          else echo '{"userns-remap": "default"}' > /tmp/daemon.json; fi
          sudo mv /tmp/daemon.json "$f"
          sudo systemctl restart docker
          docker info --format '{{json .SecurityOptions}}' | tee /dev/stderr | grep -q userns
      - name: Container end-to-end test under userns-remap and umask 077
        run: umask 077 && bash scripts/container-test.sh
