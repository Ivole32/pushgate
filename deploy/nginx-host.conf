# Server block for nginx running on the HOST, in front of pushgate published on 127.0.0.1:2580.
# Do not enable ngx_http_realip_module (set_real_ip_from / real_ip_header) for this server:
# nginx is the first hop and must use the TCP peer address.

server {
    listen 192.0.2.10:443 ssl;           # the host's LAN address
    http2 on;
    server_name notify.home.example;

    ssl_certificate     /etc/ssl/pushgate/fullchain.pem;
    ssl_certificate_key /etc/ssl/pushgate/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Optional: restrict who can reach this site at all (pushgate enforces its own CIDRs too).
    # allow 192.168.1.0/24;
    # deny all;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:2580;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append): exactly one address, the TCP peer.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Real-IP "";
        proxy_read_timeout 60s;
    }
}
