# Server block for nginx running on the HOST, in front of pushgate published on 127.0.0.1:2580.
# Do not enable ngx_http_realip_module (set_real_ip_from / real_ip_header) for this server:
# nginx is the first hop and must use the TCP peer address.

# Per-client rate limit for the login/enrollment endpoints. Matters most with ADMIN_PUBLIC=true.
# (This file is included in nginx's http context, where limit_req_zone belongs.)
limit_req_zone $binary_remote_addr zone=pushgate_admin:10m rate=60r/m;

server {
    listen 443 ssl;                       # or a specific address, e.g. 192.0.2.10:443
    http2 on;
    server_name notify.home.example;

    # e.g. from `certbot --nginx -d notify.home.example`
    ssl_certificate     /etc/letsencrypt/live/notify.home.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notify.home.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 64k;

    # Overwrite (not append): exactly one address, the TCP peer.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_read_timeout 60s;

    # Optional defence in depth for the sending API: only your senders (pushgate checks
    # TRUSTED_CIDRS as well).
    # location /api/ {
    #     allow 203.0.113.7;
    #     deny all;
    #     proxy_pass http://127.0.0.1:2580;
    # }

    location /admin/api/ {
        limit_req zone=pushgate_admin burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:2580;
    }

    location / {
        proxy_pass http://127.0.0.1:2580;
    }
}
