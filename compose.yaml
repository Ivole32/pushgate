# Production deployment: pushgate (app) behind Caddy (TLS + forwarding header normalisation).
#
# Required before the first start (see README):
#   - .env              copied from .env.example and edited
#   - secrets/api_key_pepper, secrets/vapid_private_key  (scripts/gen-secrets.sh)
#
# Network layout:
#   edge   (bridge)            Caddy's published port; ACME/outbound for Caddy
#   proxy  (internal, no NAT)  Caddy 172.31.250.2  <->  pushgate 172.31.250.3
#   egress (bridge)            pushgate -> Web Push services (outbound HTTPS only; no published ports)
# If 172.31.250.0/29 collides with one of your networks, change it here AND in TRUSTED_PROXIES
# and in deploy/Caddyfile.
name: pushgate

services:
  pushgate:
    build: .
    image: pushgate:1.0.0
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    env_file: ${PUSHGATE_ENV_FILE:-.env}
    environment:
      PORT: "8080"
      LISTEN_HOST: 0.0.0.0
      DATA_DIR: /data
      API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      # Only Caddy may forward requests; everything else connecting directly is refused.
      TRUSTED_PROXIES: 172.31.250.2/32
    secrets: [api_key_pepper, vapid_private_key]
    volumes:
      - pushgate-data:/data
    networks:
      proxy:
        ipv4_address: 172.31.250.3
      egress: {}
    # Deliberately no "ports:" — the backend is not published on any host interface.
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=8m,noexec,nosuid,nodev
    environment:
      PUSHGATE_HOSTNAME: ${PUSHGATE_HOSTNAME:?set PUSHGATE_HOSTNAME in .env}
    ports:
      # Bind to ONE LAN address of the host, never 0.0.0.0 by accident.
      - "${LISTEN_ADDRESS:?set LISTEN_ADDRESS in .env}:${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      proxy:
        ipv4_address: 172.31.250.2
      edge: {}
    depends_on:
      pushgate:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  proxy:
    internal: true
    ipam:
      config:
        - subnet: 172.31.250.0/29
  egress: {}
  edge: {}

volumes:
  pushgate-data: {}
  caddy-data: {}
  caddy-config: {}

secrets:
  api_key_pepper:
    file: ${SECRETS_DIR:-./secrets}/api_key_pepper
  vapid_private_key:
    file: ${SECRETS_DIR:-./secrets}/vapid_private_key
