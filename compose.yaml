# Production deployment of pushgate behind the host's own HTTPS reverse proxy.
#
# Required before the first start (see README):
#   - .env              copied from .env.example and edited
#   - secrets/api_key_pepper, secrets/vapid_private_key  (scripts/gen-secrets.sh)
#
# Network layout (deployment constraints: one Docker subnet, ports 2000-2999, loopback only):
#   host reverse proxy (TLS, :443 on the LAN)  ->  127.0.0.1:${PUSHGATE_PORT}  ->  pushgate:8080
#   Docker network "pushgate" = 172.20.2.0/24, gateway 172.20.2.1, pushgate 172.20.2.10
#   Connections arriving through the loopback-published port reach the container from the
#   network gateway, so the gateway address is the only trusted proxy.
name: pushgate

services:
  pushgate:
    build: .
    image: pushgate:1.0.0
    init: true
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:size=8m,mode=1777,noexec,nosuid,nodev
    env_file: ${PUSHGATE_ENV_FILE:-.env}
    environment:
      PORT: "8080"
      LISTEN_HOST: 0.0.0.0
      DATA_DIR: /data
      API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
      VAPID_PRIVATE_KEY_FILE: /run/secrets/vapid_private_key
      # Only the host reverse proxy (arriving via the network gateway) may forward requests;
      # direct connections from other containers on the network are refused.
      TRUSTED_PROXIES: ${PUSHGATE_GATEWAY:-172.20.2.1}/32
    secrets: [api_key_pepper, vapid_private_key]
    volumes:
      - pushgate-data:/data
    networks:
      pushgate:
        ipv4_address: ${PUSHGATE_IP:-172.20.2.10}
    ports:
      # Loopback only, port in the 2000-2999 range. Never publish on 0.0.0.0.
      - "127.0.0.1:${PUSHGATE_PORT:-2580}:8080"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "src/healthcheck.js"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    stop_grace_period: 20s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

networks:
  pushgate:
    # Not "internal": pushgate needs outbound HTTPS to the Web Push services.
    ipam:
      config:
        - subnet: ${PUSHGATE_SUBNET:-172.20.2.0/24}
          gateway: ${PUSHGATE_GATEWAY:-172.20.2.1}

volumes:
  pushgate-data: {}

secrets:
  api_key_pepper:
    file: ${SECRETS_DIR:-./secrets}/api_key_pepper
  vapid_private_key:
    file: ${SECRETS_DIR:-./secrets}/vapid_private_key
